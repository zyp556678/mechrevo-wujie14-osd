<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- The system bus denies name ownership by default, so the daemon
       needs an explicit rule to take its well-known name. -->
  <policy user="root">
    <allow own="org.mechrevo.Mifs"/>
  </policy>

  <!-- Any session user may talk to the daemon and receive its signals,
       so the GNOME Shell extension can subscribe. -->
  <policy context="default">
    <allow send_destination="org.mechrevo.Mifs"/>
    <allow receive_sender="org.mechrevo.Mifs"/>
  </policy>
</busconfig>
